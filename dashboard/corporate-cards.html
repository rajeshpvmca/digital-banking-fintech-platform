<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: transparent; padding: 1.5rem; overflow-y: auto; overflow-x: hidden; }
        .stat-card { background: var(--surface-container-lowest); border: 1px solid rgba(0,0,0,0.05); border-radius: 16px; padding: 1.5rem; transition: transform 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(76, 29, 149, 0.1); border-color: var(--primary); }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold text-primary mb-0 font-headline-md">Corporate Cards</h4>
            <button onclick="window.location.href='404.html'"404.html'" class="btn btn-secondary-modern rounded-pill px-4 py-2 d-flex align-items-center gap-2 shadow-sm transition-transform hover-scale-105">
                <span class="material-symbols-outlined fs-6">add</span> Issue New Card
            </button>
        </div>

        <div class="row g-4">
            <div class="col-12 col-md-4">
                <div class="stat-card h-100">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="user-avatar" style="width: 40px; height: 40px; background: #e2e8f0; color: var(--primary); font-weight: bold; border-radius: 50%; display: flex; align-items: center; justify-content: center;">S</div>
                        <div>
                            <h6 class="mb-0 fw-bold text-primary">Sarah Jenkins</h6>
                            <small class="text-muted">Marketing Dept</small>
                        </div>
                    </div>
                    <div class="mb-3 p-3 bg-light rounded-3 border border-outline-variant">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold text-secondary">**** **** **** 8291</span>
                            <span class="badge bg-success bg-opacity-10 text-success rounded-pill">Active</span>
                        </div>
                        <div class="small text-muted mb-1">Monthly Limit: $2,000</div>
                        <div class="progress mb-1" style="height: 6px;">
                            <div class="progress-bar bg-warning" style="width: 85%;"></div>
                        </div>
                        <small class="text-muted d-block text-end">$1,700 spent</small>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-secondary-modern flex-grow-1" onclick="window.location.href='404.html'">Manage Limits</button>
                        <button class="btn btn-sm btn-outline-danger px-3" onclick="window.location.href='404.html'"><span class="material-symbols-outlined fs-6 align-middle">lock</span></button>
                    </div>
                </div>
            </div>
            
            <div class="col-12 col-md-4">
                <div class="stat-card h-100">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="user-avatar" style="width: 40px; height: 40px; background: #e2e8f0; color: var(--primary); font-weight: bold; border-radius: 50%; display: flex; align-items: center; justify-content: center;">M</div>
                        <div>
                            <h6 class="mb-0 fw-bold text-primary">Michael Chen</h6>
                            <small class="text-muted">Sales Team</small>
                        </div>
                    </div>
                    <div class="mb-3 p-3 bg-light rounded-3 border border-outline-variant">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold text-secondary">**** **** **** 1045</span>
                            <span class="badge bg-success bg-opacity-10 text-success rounded-pill">Active</span>
                        </div>
                        <div class="small text-muted mb-1">Monthly Limit: $5,000</div>
                        <div class="progress mb-1" style="height: 6px;">
                            <div class="progress-bar bg-primary" style="width: 30%;"></div>
                        </div>
                        <small class="text-muted d-block text-end">$1,500 spent</small>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-secondary-modern flex-grow-1" onclick="window.location.href='404.html'">Manage Limits</button>
                        <button class="btn btn-sm btn-outline-danger px-3" onclick="window.location.href='404.html'"><span class="material-symbols-outlined fs-6 align-middle">lock</span></button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="stat-card h-100 d-flex flex-column align-items-center justify-content-center text-center p-5" style="border: 2px dashed var(--outline-variant); background: transparent; cursor: pointer;">
                    <div class="p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
                        <span class="material-symbols-outlined fs-2">add_card</span>
                    </div>
                    <h5 class="fw-bold text-primary mb-1">Issue New Card</h5>
                    <p class="text-muted small mb-0">Virtual or Physical cards for your team.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
