<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 2rem;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        body::-webkit-scrollbar { width: 6px; }
        body::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        
        .dash-card {
            background: #ffffff;
            border-radius: 1rem;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 4px 15px rgba(7, 2, 53, 0.05);
        }

        .profile-header {
            background: linear-gradient(135deg, var(--primary), #1a154d);
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            color: white;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .profile-header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,193,7,0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 3px solid var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            position: relative;
            z-index: 2;
        }

        .form-label {
            font-weight: 600;
            color: var(--primary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 0.75rem;
            padding: 0.8rem 1rem;
            font-weight: 500;
            color: var(--primary);
            background-color: #f8f9fa;
        }
        
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(7, 2, 53, 0.1);
            border-color: var(--primary);
            background-color: #ffffff;
        }

        .form-control:read-only {
            background-color: rgba(0,0,0,0.03);
            color: #6c757d;
        }
        
        .password-strength {
            height: 6px;
            border-radius: 3px;
            background-color: rgba(0,0,0,0.05);
            margin-top: 8px;
            overflow: hidden;
        }
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container-fluid p-0">
        
        <!-- Profile Banner -->
        <div class="profile-header shadow-sm">
            <div class="avatar-large" id="profileAvatar">U</div>
            <div style="z-index: 2;">
                <h2 class="fw-bold mb-1" id="displayProfileName">User Name</h2>
                <span class="badge bg-white text-primary rounded-pill px-3 py-1 mb-2 fw-bold" id="profileRole">Role</span>
                <div class="d-flex gap-3 opacity-75 small fw-bold">
                    <span><span class="material-symbols-outlined fs-6 align-middle me-1">mail</span> <span id="displayEmail">email@example.com</span></span>
                    <span><span class="material-symbols-outlined fs-6 align-middle me-1">location_on</span> <span id="displayCountry">United States</span></span>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Personal Info -->
            <div class="col-lg-6">
                <div class="dash-card p-4 h-100">
                    <div class="d-flex align-items-center gap-2 mb-4">
                        <span class="material-symbols-outlined text-primary fs-4">account_circle</span>
                        <h5 class="fw-bold text-primary mb-0">Personal Information</h5>
                    </div>
                    
                    <form onsubmit="saveProfile(event)">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="editName" placeholder="Enter your full name" required>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="editEmail" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="editPhone" placeholder="Your Number">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Country</label>
                                <input type="text" class="form-control" id="editCountry" placeholder="Your Country">
                            </div>
                        </div>
                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-primary rounded-pill px-4 py-2 fw-bold shadow-sm">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Change Password -->
            <div class="col-lg-6">
                <div class="dash-card p-4 h-100">
                    <div class="d-flex align-items-center gap-2 mb-4">
                        <span class="material-symbols-outlined text-primary fs-4">lock</span>
                        <h5 class="fw-bold text-primary mb-0">Security</h5>
                    </div>
                    
                    <form onsubmit="updatePassword(event)">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">New Password</label>
                                <div class="position-relative">
                                    <input type="password" class="form-control" id="newPassword" placeholder="Create new password" required>
                                </div>
                                <div class="password-strength">
                                    <div class="strength-bar" id="strengthBar"></div>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmNewPassword" placeholder="Confirm your new password" required>
                                <div id="matchMsg" class="mt-1 small fw-bold"></div>
                            </div>
                        </div>
                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-outline-primary rounded-pill px-4 py-2 fw-bold">Update Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load user data
        let user = JSON.parse(localStorage.getItem('loggedInUser'));
        if (!user) {
            user = { name: 'Demo User', email: 'demo@example.com', role: 'Student', phone: '1234567890', country: 'United States' };
        }
        
        document.getElementById('profileAvatar').textContent = user.name.charAt(0).toUpperCase();
        document.getElementById('displayProfileName').textContent = user.name;
        document.getElementById('profileRole').textContent = user.role || 'User';
        document.getElementById('displayEmail').textContent = user.email;
        document.getElementById('displayCountry').textContent = user.country || 'United States';
        
        document.getElementById('editName').value = user.name;
        document.getElementById('editEmail').value = user.email;
        document.getElementById('editPhone').value = user.phone || '';
        document.getElementById('editCountry').value = user.country || '';

        // Save Profile
        function saveProfile(e) {
            e.preventDefault();
            const newName = document.getElementById('editName').value.trim();
            const newPhone = document.getElementById('editPhone').value.trim();
            const newCountry = document.getElementById('editCountry').value.trim();

            if (newName) {
                user.name = newName;
                user.phone = newPhone;
                user.country = newCountry;
                localStorage.setItem('loggedInUser', JSON.stringify(user));
                
                document.getElementById('displayProfileName').textContent = newName;
                document.getElementById('displayCountry').textContent = newCountry || 'United States';
                document.getElementById('profileAvatar').textContent = newName.charAt(0).toUpperCase();
                
                // Notify parent iframe to update sidebar avatar
                try {
                    window.parent.document.getElementById('navUserName').textContent = newName;
                    window.parent.document.getElementById('userAvatar').textContent = newName.charAt(0).toUpperCase();
                } catch(e) {}
                
                alert('Profile updated successfully!');
            }
        }

        // Password Logic
        const newPwd = document.getElementById('newPassword');
        const confPwd = document.getElementById('confirmNewPassword');
        const sBar = document.getElementById('strengthBar');
        const mMsg = document.getElementById('matchMsg');
        
        const pwdRules = {
            'r-len': v => v.length >= 8,
            'r-upper': v => /[A-Z]/.test(v),
            'r-num': v => /[0-9]/.test(v),
            'r-sym': v => /[^A-Za-z0-9]/.test(v)
        };
        const sColors = ['#dc3545', '#fd7e14', '#ffc107', '#198754'];

        newPwd.addEventListener('input', () => {
            const v = newPwd.value;
            let passed = 0;
            Object.values(pwdRules).forEach(fn => { if (fn(v)) passed++; });
            sBar.style.width = (passed / 4 * 100) + '%';
            sBar.style.backgroundColor = sColors[passed - 1] || 'transparent';
            checkNewMatch();
        });

        confPwd.addEventListener('input', checkNewMatch);

        function checkNewMatch() {
            if (!confPwd.value) { mMsg.textContent = ''; return; }
            if (confPwd.value === newPwd.value) {
                mMsg.style.color = '#198754';
                mMsg.textContent = 'Passwords match';
            } else {
                mMsg.style.color = '#dc3545';
                mMsg.textContent = 'Passwords do not match';
            }
        }

        function updatePassword(e) {
            e.preventDefault();
            const pwd = newPwd.value;
            const conf = confPwd.value;
            
            let passed = 0;
            Object.values(pwdRules).forEach(fn => { if (fn(pwd)) passed++; });

            if (passed < 4) {
                alert('Password must be 8+ chars and contain an uppercase, number, and symbol.');
                return;
            }
            if (pwd !== conf) {
                alert('Passwords do not match.');
                return;
            }

            const registryKey = "user_" + user.email;
            const regUser = JSON.parse(localStorage.getItem(registryKey));
            
            if (regUser) {
                regUser.password = pwd;
                localStorage.setItem(registryKey, JSON.stringify(regUser));
                alert('Password updated successfully!');
            } else {
                alert('Demo mode: Password updated successfully!');
            }
            newPwd.value = ''; confPwd.value = '';
            sBar.style.width = '0%'; mMsg.textContent = '';
        }
    </script>
</body>
</html>
