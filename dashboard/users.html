<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: transparent; padding: 1.5rem; overflow-y: auto; overflow-x: hidden; }
        .stat-card { background: var(--surface-container-lowest); border: 1px solid rgba(0,0,0,0.05); border-radius: 16px; padding: 1.5rem; transition: transform 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold text-primary mb-0 font-headline-md">User Management</h4>
            <button class="btn indigo-gradient text-white rounded-pill px-4 py-2 d-flex align-items-center gap-2 shadow-sm transition-transform hover-scale-105">
                <span class="material-symbols-outlined fs-6">person_add</span> Add User
            </button>
        </div>
        
        <div class="stat-card">
            <div class="row g-3 mb-4">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 rounded-start-pill border-outline-variant"><span class="material-symbols-outlined text-muted">search</span></span>
                        <input type="text" class="form-control bg-light border-start-0 rounded-end-pill border-outline-variant px-2" placeholder="Search users by name or email...">
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select rounded-pill px-4 border-outline-variant bg-light">
                        <option>All Roles</option>
                        <option>Personal</option>
                        <option>Business</option>
                        <option>Wealth</option>
                        <option>Admin</option>
                    </select>
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn btn-outline-secondary rounded-pill px-4">Export List</button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="text-secondary small fw-bold text-uppercase" style="letter-spacing: 1px;">
                        <tr>
                            <th class="border-0">User Details</th>
                            <th class="border-0">Role</th>
                            <th class="border-0">Joined Date</th>
                            <th class="border-0">Status</th>
                            <th class="border-0 text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="border-top">
                        <tr>
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <div class="user-avatar" style="width: 40px; height: 40px; background: var(--tertiary); color: var(--primary); font-weight: bold; border-radius: 50%; display: flex; align-items: center; justify-content: center;">J</div>
                                    <div>
                                        <h6 class="mb-0 fw-bold text-primary">John Doe</h6>
                                        <small class="text-muted">john.doe@example.com</small>
                                    </div>
                                </div>
                            </td>
                            <td><span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 rounded-pill px-3">Personal</span></td>
                            <td class="text-muted">Sep 15, 2026</td>
                            <td><span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 rounded-pill px-3">Active</span></td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-light rounded-circle p-2"><span class="material-symbols-outlined fs-6">more_vert</span></button>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <div class="user-avatar" style="width: 40px; height: 40px; background: var(--tertiary); color: var(--primary); font-weight: bold; border-radius: 50%; display: flex; align-items: center; justify-content: center;">A</div>
                                    <div>
                                        <h6 class="mb-0 fw-bold text-primary">Alice Smith</h6>
                                        <small class="text-muted">alice.s@company.com</small>
                                    </div>
                                </div>
                            </td>
                            <td><span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary border-opacity-25 rounded-pill px-3">Business</span></td>
                            <td class="text-muted">Aug 02, 2026</td>
                            <td><span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 rounded-pill px-3">Active</span></td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-light rounded-circle p-2"><span class="material-symbols-outlined fs-6">more_vert</span></button>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <div class="user-avatar" style="width: 40px; height: 40px; background: var(--tertiary); color: var(--primary); font-weight: bold; border-radius: 50%; display: flex; align-items: center; justify-content: center;">R</div>
                                    <div>
                                        <h6 class="mb-0 fw-bold text-primary">Robert Chen</h6>
                                        <small class="text-muted">robert.c@example.com</small>
                                    </div>
                                </div>
                            </td>
                            <td><span class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-25 rounded-pill px-3">Wealth</span></td>
                            <td class="text-muted">Oct 10, 2026</td>
                            <td><span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 rounded-pill px-3">Suspended</span></td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-light rounded-circle p-2"><span class="material-symbols-outlined fs-6">more_vert</span></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <nav class="mt-4">
                <ul class="pagination justify-content-end mb-0">
                    <li class="page-item disabled"><a class="page-link rounded-start-pill" href="#">Previous</a></li>
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link rounded-end-pill" href="#">Next</a></li>
                </ul>
            </nav>
        </div>
    </div>
</body>
</html>
