<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: transparent; padding: 1.5rem; overflow-y: auto; overflow-x: hidden; }
        .stat-card { background: var(--surface-container-lowest); border: 1px solid rgba(0,0,0,0.05); border-radius: 16px; padding: 1.5rem; transition: transform 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(76, 29, 149, 0.1); border-color: var(--primary); }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <h4 class="fw-bold text-primary mb-4 font-headline-md">Wealth Portfolio</h4>
        
        <div class="row g-4 mb-4">
            <div class="col-12 col-xl-8">
                <div class="stat-card h-100">
                    <div class="d-flex justify-content-between align-items-start mb-4">
                        <div>
                            <span class="text-secondary fw-semibold">Net Worth</span>
                            <h2 class="fw-bold text-primary mb-1">$1,245,600.00</h2>
                            <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 rounded-pill"><span class="material-symbols-outlined fs-6 align-middle">trending_up</span> +5.2% this year</span>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-secondary-modern active" onclick="window.location.href='404.html'">1M</button>
                            <button class="btn btn-sm btn-secondary-modern" onclick="window.location.href='404.html'">6M</button>
                            <button class="btn btn-sm btn-secondary-modern" onclick="window.location.href='404.html'">1Y</button>
                            <button class="btn btn-sm btn-secondary-modern" onclick="window.location.href='404.html'">ALL</button>
                        </div>
                    </div>
                    
                    <!-- SVG Chart Placeholder -->
                    <div class="w-100 rounded-3 d-flex align-items-end justify-content-center p-3 mt-4" style="height: 250px; background: rgba(76, 29, 149, 0.02); border: 1px dashed rgba(76, 29, 149, 0.2);">
                        <svg viewBox="0 0 500 150" preserveAspectRatio="none" style="width: 100%; height: 100%;">
                            <path d="M0,150 L0,80 Q50,90 100,50 T200,60 T300,20 T400,40 T500,10 L500,150 Z" fill="rgba(76, 29, 149, 0.1)"></path>
                            <path d="M0,80 Q50,90 100,50 T200,60 T300,20 T400,40 T500,10" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round"></path>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="col-12 col-xl-4">
                <div class="stat-card h-100">
                    <h5 class="fw-bold text-primary mb-4">Asset Allocation</h5>
                    
                    <!-- Circle Chart Placeholder -->
                    <div class="d-flex justify-content-center mb-4">
                        <div style="width: 150px; height: 150px; border-radius: 50%; background: conic-gradient(#4c1d95 0% 45%, #22c55e 45% 75%, #dfb78c 75% 90%, #facc15 90% 100%); position: relative;">
                            <div style="position: absolute; inset: 20px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                <span class="fw-bold fs-5 text-primary">4</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-flex flex-column gap-3 mt-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-2">
                                <div style="width: 12px; height: 12px; border-radius: 3px; background: #4c1d95;"></div>
                                <span class="fw-semibold text-secondary">Equities</span>
                            </div>
                            <span class="fw-bold">45%</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-2">
                                <div style="width: 12px; height: 12px; border-radius: 3px; background: #22c55e;"></div>
                                <span class="fw-semibold text-secondary">Real Estate</span>
                            </div>
                            <span class="fw-bold">30%</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-2">
                                <div style="width: 12px; height: 12px; border-radius: 3px; background: #dfb78c;"></div>
                                <span class="fw-semibold text-secondary">Bonds</span>
                            </div>
                            <span class="fw-bold">15%</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-2">
                                <div style="width: 12px; height: 12px; border-radius: 3px; background: #facc15;"></div>
                                <span class="fw-semibold text-secondary">Crypto</span>
                            </div>
                            <span class="fw-bold">10%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
