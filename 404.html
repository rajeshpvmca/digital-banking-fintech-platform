<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stackly Digital Banking</title>
    <meta name="description" content="The page you are looking for does not exist. Return to Stackly Digital Banking.">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: var(--background);
            overflow-y: auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Abstract Background Elements */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
            animation: orbFloat 15s infinite alternate ease-in-out;
        }
        .orb-1 { width: 400px; height: 400px; background: rgba(76, 29, 149, 0.4); top: -10%; left: -10%; }
        .orb-2 { width: 500px; height: 500px; background: rgba(223, 183, 140, 0.3); bottom: -20%; right: -10%; animation-delay: -5s; }
        .orb-3 { width: 300px; height: 300px; background: rgba(34, 197, 94, 0.15); top: 40%; left: 60%; animation-delay: -10s; }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
            100% { transform: translate(-30px, 50px) scale(0.9); }
        }

        /* 404 Specific Styling */
        .error-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            padding: 2rem 1rem;
        }

        .error-glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            padding: 4rem 3rem;
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(76, 29, 149, 0.1), 0 0 0 1px rgba(255,255,255,0.4) inset;
            transform: translateY(0);
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin-bottom: 0;
            background: linear-gradient(135deg, var(--primary) 0%, var(--tertiary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 20px 40px rgba(76, 29, 149, 0.2);
            position: relative;
            display: inline-block;
        }

        .error-code::after {
            content: '404';
            position: absolute;
            left: 0;
            top: 0;
            z-index: -1;
            background: transparent;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 2px rgba(76, 29, 149, 0.1);
            transform: translate(-10px, 10px);
        }

        .floating-icon {
            position: absolute;
            animation: float 6s ease-in-out infinite;
            color: var(--primary);
            opacity: 0.2;
            z-index: -1;
        }
        
        .icon-1 { top: 10%; left: 10%; font-size: 3rem; animation-delay: 0s; }
        .icon-2 { top: 20%; right: 15%; font-size: 4rem; animation-delay: -2s; color: var(--tertiary); }
        .icon-3 { bottom: 15%; left: 20%; font-size: 2.5rem; animation-delay: -4s; }

        @media (max-width: 575.98px) {
            .error-code { font-size: 6rem; }
            .error-glass-card { padding: 3rem 1.5rem; }
        }
    </style>
</head>
<body class="overflow-hidden">

   

    <!-- Background Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    
    <!-- Floating Icons behind the card -->
    <span class="material-symbols-outlined floating-icon icon-1">account_balance</span>
    <span class="material-symbols-outlined floating-icon icon-2">credit_card</span>
    <span class="material-symbols-outlined floating-icon icon-3">currency_exchange</span>

    <main class="error-container overflow-hidden">
        <div class="error-glass-card">
            <div class="p-3 bg-danger bg-opacity-10 text-danger rounded-circle d-inline-flex mb-4">
                <span class="material-symbols-outlined fs-2">explore_off</span>
            </div>
            
            <h1 class="error-code mb-3">404</h1>
            <h2 class="font-headline-md fw-bold text-on-surface mb-3">Oops! Page not found</h2>
            <p class="text-secondary mb-5 font-body-md px-md-4">
                The page you're looking for might have been removed, had its name changed, or is temporarily unavailable. Don't worry, your finances are perfectly safe!
            </p>
            
            <div class="d-grid gap-3 d-sm-flex justify-content-sm-center mt-4">
                <a href="index.html" class="btn btn-primary-modern rounded-pill px-4 px-sm-5 py-3 fw-bold d-flex align-items-center justify-content-center gap-2 shadow-sm transition-transform hover-scale-105">
                    <span class="material-symbols-outlined">home</span> Back to Home
                </a>
                <button onclick="history.back()" class="btn btn-secondary-modern rounded-pill px-4 px-sm-5 py-3 fw-bold d-flex align-items-center justify-content-center gap-2 transition-transform hover-scale-105">
                    <span class="material-symbols-outlined">arrow_back</span> Go Back
                </button>
            </div>
        </div>
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
