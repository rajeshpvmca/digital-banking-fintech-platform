<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login | Stackly</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Geist:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Material Symbols & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome for Form Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            position: relative;
            background-color: var(--bs-surface);
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .auth-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            z-index: -1;
        }

        .auth-card {
            background: rgba(30, 41, 59, 0.7) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4) !important;
            overflow: hidden;
        }

        .unique-role-selector {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .unique-role-item {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 5px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1;
            text-align: center;
        }

        .unique-role-item span.material-symbols-outlined {
            font-size: 1.5rem;
            color: rgba(255,255,255,0.7);
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }

        .unique-role-item .role-text {
            font-weight: 700;
            color: rgba(255,255,255,0.7);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        @media (max-width: 576px) {
            .unique-role-selector {
                gap: 5px;
            }
            .unique-role-item {
                padding: 10px 2px;
                border-radius: 8px;
            }
            .unique-role-item span.material-symbols-outlined {
                font-size: 1.2rem;
            }
            .unique-role-item .role-text {
                font-size: 0.6rem;
                letter-spacing: 0;
            }
        }

        .btn-check:checked + .unique-role-item {
            background: var(--bs-primary) !important;
            border-color: var(--bs-primary) !important;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.25);
            transform: translateY(-4px) scale(1.02);
        }

        .btn-check:checked + .unique-role-item span.material-symbols-outlined,
        .btn-check:checked + .unique-role-item .role-text {
            color: #ffffff !important;
            transform: scale(1.1);
        }

        .unique-role-item:hover {
            border-color: var(--bs-primary);
            transform: translateY(-2px);
            background: rgba(255,255,255,0.1);
        }
        
        .unique-role-item:hover .role-text,
        .unique-role-item:hover span.material-symbols-outlined {
            color: #ffffff;
        }

        /* Floating Icons Animation */
        .floating-icons .hero-shape {
            position: absolute;
            color: var(--bs-primary);
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
            transition: 0.3s;
            filter: drop-shadow(0 0 10px var(--bs-primary));
        }

        @keyframes iconDance {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-25px) rotate(-20deg) scale(1.1); }
            50% { transform: translateY(5px) rotate(15deg) scale(0.9); }
            75% { transform: translateY(-15px) rotate(10deg) scale(1.05); }
        }
        @keyframes iconBounceTwirl {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-40px) scale(1.2) rotate(180deg); }
        }
        @keyframes iconSway {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(30px) rotate(15deg) translateY(-10px); }
        }

        .hero-shape-1 { top: 10%; left: 5%; font-size: 60px; animation: iconDance 3.5s ease-in-out infinite; }
        .hero-shape-2 { top: 15%; right: 8%; font-size: 50px; animation: iconBounceTwirl 5s linear infinite; }
        .hero-shape-3 { bottom: 15%; left: 10%; font-size: 45px; animation: iconSway 4.5s ease-in-out infinite; }
        .hero-shape-4 { bottom: 20%; right: 12%; font-size: 55px; animation: iconDance 4s ease-in-out infinite 1s; }
        .hero-shape-5 { top: 45%; left: 3%; font-size: 35px; animation: iconBounceTwirl 6s linear infinite reverse; }
        .hero-shape-6 { top: 60%; right: 5%; font-size: 40px; animation: iconSway 5s ease-in-out infinite reverse; }
        .hero-shape-7 { bottom: 40%; left: 18%; font-size: 30px; animation: iconDance 3.8s ease-in-out infinite 0.5s; }
        .hero-shape-8 { top: 5%; left: 45%; font-size: 45px; animation: iconBounceTwirl 6.5s ease-in-out infinite; }

        /* Premium Input Styling */
        .auth-input-modern {
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-radius: 12px;
            color: #ffffff !important;
            padding: 1rem 1.2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1rem;
        }

        .auth-input-modern:focus {
            background: rgba(255,255,255,0.08) !important;
            border-color: var(--bs-primary) !important;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
            transform: translateY(-2px);
        }

        .auth-input-modern::placeholder {
            color: rgba(255,255,255,0.4);
        }

        /* Fix for WebKit Autofill */
        .auth-input-modern:-webkit-autofill,
        .auth-input-modern:-webkit-autofill:hover, 
        .auth-input-modern:-webkit-autofill:focus, 
        .auth-input-modern:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #1e293b inset !important;
            -webkit-text-fill-color: #ffffff !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Animated Links */
        .auth-link {
            color: var(--bs-info) !important;
            transition: all 0.3s ease;
            position: relative;
            display: inline-block;
        }
        
        .auth-link:hover {
            transform: translateX(4px);
        }
        
        .auth-link-underline {
            color: var(--bs-info) !important;
            position: relative;
            transition: color 0.3s ease;
        }
        
        .auth-link-underline::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: var(--bs-info);
            transform-origin: bottom right;
            transition: transform 0.3s ease-out;
        }
        
        .auth-link-underline:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
        
        .toggle-password {
            border-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6);
        }
        .toggle-password:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .custom-checkbox:checked {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
        }
        .custom-checkbox:focus {
            border-color: var(--bs-primary);
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }
    </style>
</head>

<body class="bg-surface font-body-md text-white">

    <div class="auth-overlay"></div>

    <div class="floating-icons d-none d-md-block">
        <span class="material-symbols-outlined hero-shape hero-shape-1">account_balance</span>
        <span class="material-symbols-outlined hero-shape hero-shape-2">credit_card</span>
        <span class="material-symbols-outlined hero-shape hero-shape-3">payments</span>
        <span class="material-symbols-outlined hero-shape hero-shape-4">trending_up</span>
        <span class="material-symbols-outlined hero-shape hero-shape-5">security</span>
        <span class="material-symbols-outlined hero-shape hero-shape-6">account_balance_wallet</span>
        <span class="material-symbols-outlined hero-shape hero-shape-7">currency_exchange</span>
        <span class="material-symbols-outlined hero-shape hero-shape-8">pie_chart</span>
    </div>

    <div class="container position-relative py-3" style="z-index: 5;">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="auth-card rounded-5 p-4 p-lg-5" data-aos="zoom-in">
                    
                    <div class="text-center mb-4">
                                <a href="index.html" class="small text-decoration-none auth-link mb-3 d-inline-block text-white opacity-75"><i
                                        class="fas fa-arrow-left me-2"></i> Back to Home</a>
                                <h2 class="fw-bold text-white mb-2">Welcome Back!</h2>
                                <p class="text-white opacity-75">Login to your Stackly account.</p>
                            </div>

                            <form id="loginForm" >
                                <label class="form-label text-white opacity-75 small fw-bold tracking-widest text-uppercase mb-3 d-block text-center">Account Type</label>
                                <div class="unique-role-selector mb-4">
                                    <input type="radio" class="btn-check" name="loginRole" id="rolePersonal"
                                        value="Personal" checked autocomplete="off">
                                    <label class="unique-role-item" for="rolePersonal">
                                        <span class="material-symbols-outlined fs-3 mb-1">person</span>
                                        <span class="role-text">Personal</span>
                                    </label>

                                    <input type="radio" class="btn-check" name="loginRole" id="roleBusiness"
                                        value="Business" autocomplete="off">
                                    <label class="unique-role-item" for="roleBusiness">
                                        <span class="material-symbols-outlined fs-3 mb-1">storefront</span>
                                        <span class="role-text">Business</span>
                                    </label>

                                    <input type="radio" class="btn-check" name="loginRole" id="roleWealth" value="Wealth"
                                        autocomplete="off">
                                    <label class="unique-role-item" for="roleWealth">
                                        <span class="material-symbols-outlined fs-3 mb-1">monitoring</span>
                                        <span class="role-text">Wealth</span>
                                    </label>

                                    <input type="radio" class="btn-check" name="loginRole" id="roleAdmin" value="Admin"
                                        autocomplete="off">
                                    <label class="unique-role-item" for="roleAdmin">
                                        <span class="material-symbols-outlined fs-3 mb-1">admin_panel_settings</span>
                                        <span class="role-text">Admin</span>
                                    </label>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-white opacity-75 small fw-bold tracking-widest text-uppercase">Email Address</label>
                                    <input class="form-control auth-input-modern" type="email" id="loginEmail" placeholder="name@stackly.com" required>
                                </div>

                                <div class="mb-1">
                                    <label class="form-label text-white opacity-75 small fw-bold tracking-widest text-uppercase">Password</label>
                                    <div class="input-group">
                                        <input class="form-control auth-input-modern border-end-0" type="password" id="loginPassword" placeholder="Enter password" minlength="8" required>
                                        <button onclick="window.location.href='404.html'"404.html'" class="btn btn-secondary-modern toggle-password auth-input-modern border-start-0" type="button">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Strength bar -->
                                <div class="mb-1"
                                    style="height:4px;border-radius:4px;background:rgba(255,255,255,0.1);overflow:hidden;">
                                    <div id="strengthBar"
                                        style="height:100%;width:0;transition:width 0.3s, background 0.3s;"></div>
                                </div>
                                <div class="mb-4"></div>

                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div class="form-check">
                                        <input class="form-check-input custom-checkbox" type="checkbox" id="remember" required>
                                        <label class="form-check-label text-white opacity-75 small" for="remember">Remember Me</label>
                                    </div>
                                    <a href="404.html" class="small text-decoration-none auth-link-underline text-info">Forgot Password?</a>
                                </div>

                                <button  class="btn btn-primary-modern rounded-pill w-100 py-3 fw-bold mb-4 d-flex align-items-center justify-content-center gap-2 border-0 shadow-sm transition-transform hover-scale-105" >
                                    Login to Stackly <span class="material-symbols-outlined fs-5">login</span>
                                </button>

                                <p class="text-center mb-0 small text-white opacity-75">Don't have an account? <a
                                        href="signup.html" class="fw-bold text-decoration-none auth-link-underline text-info">Register Now</a></p>
                            </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            AOS.init({
                duration: 1000,
                once: true
            });
        });

        // Live password strength
        const pwdInput = document.getElementById('loginPassword');
        const bar = document.getElementById('strengthBar');
        const rules = {
            'r-len': v => v.length >= 8,
            'r-upper': v => /[A-Z]/.test(v),
            'r-num': v => /[0-9]/.test(v),
            'r-sym': v => /[^A-Za-z0-9]/.test(v)
        };
        const colors = ['#ef4444', '#f97316', '#eab308', '#22C55E'];
        const labels = ['Weak', 'Fair', 'Good', 'Strong'];

        pwdInput.addEventListener('input', () => {
            const v = pwdInput.value;
            let passed = 0;
            Object.values(rules).forEach(fn => {
                if (fn(v)) passed++;
            });
            bar.style.width = (passed / 4 * 100) + '%';
            bar.style.background = colors[passed - 1] || 'rgba(255,255,255,0.1)';
            bar.title = labels[passed - 1] || '';
        });
        
        // Toggle Password visibility
        document.querySelector('.toggle-password').addEventListener('click', function() {
            const icon = this.querySelector('i');
            if(pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    </script>

</body>

</html>
